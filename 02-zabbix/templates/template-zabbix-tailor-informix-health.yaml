        - uuid: 2837b5998e8c48f386c5bd6b6c3b56ca
          name: 'SESSION-005 — waiting client sessions - latch'
          type: DEPENDENT
          key: ifx.session.waiting_client_sessions.latch
          delay: '0'
          units: sessions
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s).*LATCH\|Waiting client sessions - latch\|([0-9]+).*'
                - \1
          master_item:
            key: ifx.session.waiting_client_sessions_by_reason.raw
        - uuid: 01ed310ded7d4610bd8e8647d9a7d766
          name: 'SESSION-005 — waiting client sessions - lock'
          type: DEPENDENT
          key: ifx.session.waiting_client_sessions.lock
          delay: '0'
          units: sessions
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s).*LOCK\|Waiting client sessions - lock\|([0-9]+).*'
                - \1
          master_item:
            key: ifx.session.waiting_client_sessions_by_reason.raw
        - uuid: 0c45ea081d764956b3fb3bde92c2e62a
          name: 'SESSION-005 — waiting client sessions - log buffer'
          type: DEPENDENT
          key: ifx.session.waiting_client_sessions.log_buffer
          delay: '0'
          units: sessions
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s).*LOG_BUFFER\|Waiting client sessions - log buffer\|([0-9]+).*'
                - \1
          master_item:
            key: ifx.session.waiting_client_sessions_by_reason.raw
        - uuid: 467e26b59706416584a399c1b30bec78
          name: 'SESSION-005 — waiting client sessions - transaction'
          type: DEPENDENT
