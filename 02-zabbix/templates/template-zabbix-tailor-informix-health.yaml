            - type: REGEX
              parameters:
                - '(?s).*TRANSACTION\|Waiting client sessions - transaction\|([0-9]+).*'
                - \1
          master_item:
            key: ifx.session.waiting_client_sessions_by_reason.raw
        - uuid: 68b2a4bf955c45a3bda04de021650526
          name: 'SESSION-005 — waiting client sessions by reason — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.session.waiting_client_sessions_by_reason.raw
          value_type: TEXT
          trends: '0'
          timeout: 30s
        - uuid: 5c2464524ba949bd8f19241fd9374d12
          name: 'SESSION-003 — weekly peak concurrent physical connections'
          type: ZABBIX_ACTIVE
          key: ifx.session.weekly_peak_physical_connections
