zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: d8dd2d075c6a4b6c8ee5d55e2100f014
      template: 'Template Zabbix Tailor Informix Health'
      name: 'Template Zabbix Tailor Informix Health'
      groups:
        - name: Templates
      items:
        - uuid: d74b9f0e1b2b45438f1af8b3c7026645
          name: 'HDR-002 — expected HDR configuration'
          type: ZABBIX_ACTIVE
          key: ifx.hdr.expected_configuration
          timeout: 30s
          triggers:
            - uuid: b5966dec75b14b6eacb0c86d668acf49
              expression: 'nodata(/Template Zabbix Tailor Informix Health/ifx.hdr.expected_configuration,3m)=1'
              name: 'HDR-002: HDR compliance collection has stopped'
              priority: HIGH
              tags:
                - tag: informix
                  value: hdr-002
            - uuid: fccfac78a45543378a9ba95e9fb1a466
              expression: 'last(/Template Zabbix Tailor Informix Health/ifx.hdr.expected_configuration)=3'
              name: 'HDR-002: HDR configuration or topology cannot be verified'
              priority: HIGH
              tags:
                - tag: informix
                  value: hdr-002
            - uuid: 810a09dd34494d5482b7f7bd48fae781
              expression: 'last(/Template Zabbix Tailor Informix Health/ifx.hdr.expected_configuration)=2'
              name: 'HDR-002: required HDR relationship is absent or wrong'
              priority: HIGH
              tags:
                - tag: informix
                  value: hdr-002
        - uuid: 3e8df7956c314bb595a84bfacea52691
          name: 'HDR-001 — local role and state — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.hdr.local_state.raw
          value_type: TEXT
          trends: '0'
          timeout: 30s
        - uuid: b25cae27e5064d64ae9434b3784f4500
          name: 'HEALTH-003 — assertion failures count'
          type: DEPENDENT
          key: ifx.health.assert_failures.count
          delay: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?m)^COUNT\|([0-9]+)$'
                - \1
          master_item:
            key: ifx.health.assert_failures.raw
          triggers:
            - uuid: 8465f29ed9df4d1ebe883f7f0c1c7167
              expression: 'last(/Template Zabbix Tailor Informix Health/ifx.health.assert_failures.count)>0'
              name: 'Informix HEALTH-003: new assertion failure event(s) detected'
              priority: HIGH
              tags:
                - tag: informix
                  value: health-003
        - uuid: 4c8082f8bea54326884acd74f07e388f
          name: 'HEALTH-003 — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.health.assert_failures.raw
          value_type: TEXT
          trends: '0'
          timeout: 30s
        - uuid: d24e9eed5f944a8e996af86c6408a4fe
          name: 'HEALTH-004 — cumulative checkpoint count'
          type: ZABBIX_ACTIVE
          key: ifx.health.checkpoint_count
          units: checkpoints
          timeout: 30s
        - uuid: c066f9e065094e3bae122599adabdf5f
          name: 'HEALTH-005 — last checkpoint duration'
          type: ZABBIX_ACTIVE
          key: ifx.health.checkpoint_duration
          value_type: FLOAT
          units: s
          timeout: 30s
        - uuid: 5184cd7ebed44288b9cce4aaf5f67ec5
          name: 'HEALTH-006 — cumulative checkpoint waits'
          type: ZABBIX_ACTIVE
          key: ifx.health.checkpoint_waits
          units: waits
          timeout: 30s
        - uuid: bd401291796745fc8644fa4c6c05c979
          name: 'HEALTH-008 — cumulative foreground writes'
          type: ZABBIX_ACTIVE
          key: ifx.health.foreground_writes
          units: writes
          timeout: 30s
        - uuid: aa8a9e5eac3642e6b41efd6eb8199ef1
          name: 'HEALTH-001 — instance state code'
          type: ZABBIX_ACTIVE
          key: ifx.health.instance_state
          trends: '0'
          timeout: 30s
          triggers:
            - uuid: c23e73c29e5f4185852c3bb08b0c63c9
              expression: 'last(/Template Zabbix Tailor Informix Health/ifx.health.instance_state)<>5'
              name: 'Informix HEALTH-001: instance is not Online'
              priority: HIGH
              tags:
                - tag: informix
                  value: health-001
            - uuid: c66d8e6ba73041deac8161f10d626496
              expression: 'nodata(/Template Zabbix Tailor Informix Health/ifx.health.instance_state,3m)=1'
              name: 'Informix HEALTH-001: instance state has not been collected for 3 minutes'
              priority: HIGH
              tags:
                - tag: informix
                  value: health-001
        - uuid: 18b7824b8d4341c591c81d50746cca71
          name: 'HEALTH-002 — instance uptime'
          type: ZABBIX_ACTIVE
          key: ifx.health.instance_uptime
          units: uptime
          timeout: 30s
          triggers:
            - uuid: a761df1690804ffabb87046cf0465ad0
              expression: 'last(/Template Zabbix Tailor Informix Health/ifx.health.instance_uptime)<last(/Template Zabbix Tailor Informix Health/ifx.health.instance_uptime,#2)'
              name: 'Informix HEALTH-002: instance restart detected'
              priority: WARNING
              tags:
                - tag: informix
                  value: health-002
        - uuid: 46b5b513198743a999ee04de0e1c9ec9
          name: 'HEALTH-007 — cumulative LRU writes'
          type: ZABBIX_ACTIVE
          key: ifx.health.lru_writes
          units: writes
          timeout: 30s
        - uuid: b246e6a3da1449fdaf9125ea0ea62cc1
          name: 'LOCK-004 — deadlocks'
          type: ZABBIX_ACTIVE
          key: ifx.lock.deadlocks
          units: deadlocks
          timeout: 30s
          triggers:
            - uuid: 6841b7b4ce1d4326be8ae4b6de758408
              expression: 'change(/Template Zabbix Tailor Informix Health/ifx.lock.deadlocks)>0'
              name: 'LOCK-004: new Informix deadlock(s) detected'
              priority: HIGH
              tags:
                - tag: informix
                  value: lock-004
        - uuid: 14bf256b8c31431599b0f3d3ca818982
          name: 'LOCK-001 — sessions waiting for locks'
          type: ZABBIX_ACTIVE
          key: ifx.lock.sessions_waiting
          units: sessions
          timeout: 30s
          triggers:
            - uuid: b540e61cbe154f43a64f08105b7753d6
              expression: 'min(/Template Zabbix Tailor Informix Health/ifx.lock.sessions_waiting,90s)>0'
              name: 'Informix LOCK-001: session(s) waiting for locks detected'
              priority: HIGH
              tags:
                - tag: informix
                  value: lock-001
        - uuid: 65f0e829040d4075931f16376e6f785a
          name: 'LOCK-005 — lock table exhaustion attempts'
          type: ZABBIX_ACTIVE
          key: ifx.lock.table_exhaustion_attempts
          units: attempts
          timeout: 30s
          triggers:
            - uuid: ce7c3bbe16e94c2082be0b78fe8c174b
              expression: 'change(/Template Zabbix Tailor Informix Health/ifx.lock.table_exhaustion_attempts)>0'
              name: 'LOCK-005: Informix lock table exhaustion attempt(s) detected'
              priority: HIGH
              tags:
                - tag: informix
                  value: lock-005
        - uuid: d979412456db4688952183660525d12b
          name: 'LOCK-003 — lock timeouts'
          type: ZABBIX_ACTIVE
          key: ifx.lock.timeouts
          units: timeouts
          timeout: 30s
        - uuid: 0e15570cbe0048daa5c19f55ad30fc9b
          name: 'LOCK-002 — lock waits'
          type: ZABBIX_ACTIVE
          key: ifx.lock.waits
          units: waits
          timeout: 30s
        - uuid: a1e202c820854d47ae1124e0cc78f4c8
          name: 'LOG-001 — current logical-log utilization'
          type: ZABBIX_ACTIVE
          key: ifx.log.current_utilization
          value_type: FLOAT
          units: '%'
          timeout: 30s
          triggers:
            - uuid: 2362920d45c24939b35521ca69e831d9
              expression: 'last(/Template Zabbix Tailor Informix Health/ifx.log.current_utilization)>80'
              name: 'Informix LOG-001: current logical-log utilization is above 80%'
              priority: WARNING
              tags:
                - tag: informix
                  value: log-001
            - uuid: f773ecfaecff4077a8655c589c2ca1f7
              expression: 'last(/Template Zabbix Tailor Informix Health/ifx.log.current_utilization)>90'
              name: 'Informix LOG-001: current logical-log utilization is above 90%'
              priority: HIGH
              tags:
                - tag: informix
                  value: log-001
        - uuid: 235789ab44c445a4bc58f14141b15ce7
          name: 'LOG-005 — logical logs full'
          type: ZABBIX_ACTIVE
          key: ifx.log.full
          units: logs
          timeout: 30s
        - uuid: ebd4ff52b4264da39c65bfcb0d2dce03
          name: 'LOG-003 — logical logs not archived'
          type: ZABBIX_ACTIVE
          key: ifx.log.not_archived
          units: logs
          timeout: 30s
        - uuid: 090015ad9d7949f09e3fe00d7f01fcfa
          name: 'LOG-002 — logical logs not backed up'
          type: ZABBIX_ACTIVE
          key: ifx.log.not_backed_up
          units: logs
          timeout: 30s
        - uuid: 70752b71335e4c4ba2c2ce71f910f888
          name: 'LOG-004 — physical-log utilization'
          type: ZABBIX_ACTIVE
          key: ifx.log.physical_utilization
          value_type: FLOAT
          units: '%'
          timeout: 30s
          triggers:
            - uuid: a0b925ed2afa4f58909f2544944724d7
              expression: 'last(/Template Zabbix Tailor Informix Health/ifx.log.physical_utilization)>80'
              name: 'Informix LOG-004: physical-log utilization is above 80%'
              priority: WARNING
              tags:
                - tag: informix
                  value: log-004
            - uuid: db3516c31d16444a909a8e16e6b725ae
              expression: 'last(/Template Zabbix Tailor Informix Health/ifx.log.physical_utilization)>90'
              name: 'Informix LOG-004: physical-log utilization is above 90%'
              priority: HIGH
              tags:
                - tag: informix
                  value: log-004
        - uuid: fab1f82859824d9da09e5340e1c72067
          name: 'SESSION-002 — sessions in read call'
          type: ZABBIX_ACTIVE
          key: ifx.session.in_read_call
          units: sessions
          timeout: 30s
        - uuid: a36ee168da7f4b4e98ba8ea8b515aef4
          name: 'SESSION-001 — total connected client sessions'
          type: ZABBIX_ACTIVE
          key: ifx.session.total_connected
          units: sessions
          timeout: 30s
        - uuid: 31df46f8a1764cf0a34f867cae96888b
          name: 'SESSION-004 — waiting client sessions total'
          type: ZABBIX_ACTIVE
          key: ifx.session.waiting_client_sessions
          units: sessions
          timeout: 30s
        - uuid: 5c2464524ba949bd8f19241fd9374d12
          name: 'SESSION-003 — weekly peak concurrent physical connections'
          type: ZABBIX_ACTIVE
          key: ifx.session.weekly_peak_physical_connections
          units: connections
          timeout: 30s
        - uuid: ad96832ec8de4a1389c1d26755678462
          name: 'STORAGE-006 — chunk free space — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.storage.chunk.free_space
          delay: 5m
          value_type: TEXT
          trends: '0'
          timeout: 30s
        - uuid: 4801af12832d4d63bae2e2edf535d875
          name: 'STORAGE-004 — chunk state — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.storage.chunk.state
          delay: 5m
          value_type: TEXT
          trends: '0'
          timeout: 30s
        - uuid: abaf103ff85f4e4d87a4d13a0c6571e2
          name: 'STORAGE-005 — chunk utilization — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.storage.chunk.utilization
          delay: 5m
          value_type: TEXT
          trends: '0'
          timeout: 30s
        - uuid: 85bd57eab3bd486e811597e731113230
          name: 'STORAGE-002 — dbspace free space — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.storage.dbspace.free_space
          delay: 5m
          value_type: TEXT
          trends: '0'
          timeout: 30s
        - uuid: f85a11db9f4749d49a6562217492aac3
          name: 'STORAGE-003 — dbspace growth — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.storage.dbspace.growth
          delay: 5m
          value_type: TEXT
          trends: '0'
          timeout: 30s
        - uuid: 646d3827b6bf4565bd473c9b3e33b532
          name: 'STORAGE-001 — dbspace utilization — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.storage.dbspace.utilization
          delay: 5m
          value_type: TEXT
          trends: '0'
          timeout: 30s
        - uuid: 9c2ed2ce3f3c46afa4d42cfd55f7d7f8
          name: 'STORAGE-011 — temporary dbspace utilization — raw collector output'
          type: ZABBIX_ACTIVE
          key: ifx.storage.temp_dbspace.utilization
          delay: 5m
          value_type: TEXT
          trends: '0'
          timeout: 30s
      discovery_rules:
        - uuid: 51ee77f5496f45cdae4fc36bdd5983d1
          name: 'HDR-003 — HDR peer discovery'
          type: ZABBIX_ACTIVE
          key: ifx.hdr.peer.discovery
          item_prototypes:
            - uuid: 2d544f1df3ef4396a3841de5f9189a4c
              name: 'HDR-004 — {#IFX_HDR_PEER} — connection state'
              type: ZABBIX_ACTIVE
              key: 'ifx.hdr.peer.connection[{#IFX_HDR_PEER}]'
              value_type: TEXT
              trends: '0'
              timeout: 30s
              trigger_prototypes:
                - uuid: 69516806b0f94cd0b85b6376045e6f1a
                  expression: 'last(/Template Zabbix Tailor Informix Health/ifx.hdr.peer.connection[{#IFX_HDR_PEER}])<>"Connected"'
                  name: 'HDR-004: {#IFX_HDR_PEER} connection is not Connected'
                  priority: HIGH
                  tags:
                    - tag: informix
                      value: hdr-004
            - uuid: 5bc3367034bd4f8a8d70cc0a7c9270b1
              name: 'HDR-005 — {#IFX_HDR_PEER} — server state'
              type: ZABBIX_ACTIVE
              key: 'ifx.hdr.peer.server_state[{#IFX_HDR_PEER}]'
              value_type: TEXT
              trends: '0'
              timeout: 30s
              trigger_prototypes:
                - uuid: 7791989e83ef41b2a010f7ebbc1ba536
                  expression: 'last(/Template Zabbix Tailor Informix Health/ifx.hdr.peer.server_state[{#IFX_HDR_PEER}])<>"on"'
                  name: 'HDR-005: {#IFX_HDR_PEER} server state is not on'
                  priority: HIGH
                  tags:
                    - tag: informix
                      value: hdr-005
          timeout: 30s
        - uuid: d72811a6a5c2413e8a3627e7a6ae609a
          name: 'LOG-006 — backup inventory discovery'
          type: ZABBIX_ACTIVE
          key: ifx.log.backup.discovery
          delay: 1h
          item_prototypes:
            - uuid: 94538f738a6b4251baabaccede3184a5
              name: 'LOG-006 — {#IFX_DATABASE}/{#IFX_DBSPACE} — Level-0 backup age'
              type: ZABBIX_ACTIVE
              key: 'ifx.log.backup_age_days[{#IFX_DATABASE},{#IFX_DBSPACE}]'
              delay: 1h
              value_type: FLOAT
              units: days
              timeout: 30s
              trigger_prototypes:
                - uuid: 9477982294344187ac4518b841c7bb62
                  expression: 'last(/Template Zabbix Tailor Informix Health/ifx.log.backup_age_days[{#IFX_DATABASE},{#IFX_DBSPACE}])>7'
                  name: 'Informix LOG-006: Level-0 backup older than 7 days on {#IFX_DATABASE}/{#IFX_DBSPACE}'
                  priority: WARNING
                - uuid: 21e8bb6aee604d81b0c0fe0f25ad80aa
                  expression: 'last(/Template Zabbix Tailor Informix Health/ifx.log.backup_age_days[{#IFX_DATABASE},{#IFX_DBSPACE}])=-1'
                  name: 'Informix LOG-006: no Level-0 backup exists on {#IFX_DATABASE}/{#IFX_DBSPACE}'
                  priority: HIGH
          timeout: 30s
        - uuid: 4cc3cf00a79d4b1d86f716105331bd07
          name: 'STORAGE — chunk discovery'
          type: ZABBIX_ACTIVE
          key: ifx.storage.chunk.discovery
          delay: 5m
          item_prototypes:
            - uuid: 9858511911b34b7fbf6ed43c6b9aee6f
              name: 'STORAGE-004 — {#IFX_DBSPACE}/{#IFX_CHUNK} — extendable'
              type: DEPENDENT
              key: 'ifx.storage.chunk.extendable[{#IFX_DBSPACE},{#IFX_CHUNK}]'
              delay: '0'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^{#IFX_DBSPACE}\|{#IFX_CHUNK}\|[^|]+\|[01]\|[01]\|[01]\|([01])\|$'
                    - \1
              master_item:
                key: ifx.storage.chunk.state
            - uuid: 93b6d12391494adb8fb865a54ef03b27
              name: 'STORAGE-006 — {#IFX_DBSPACE}/{#IFX_CHUNK} — free space'
              type: DEPENDENT
              key: 'ifx.storage.chunk.free_gb[{#IFX_DBSPACE},{#IFX_CHUNK}]'
              delay: '0'
              value_type: FLOAT
              units: GB
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^{#IFX_DBSPACE}\|{#IFX_CHUNK}\|[^|]+\|([0-9.]+)\|$'
                    - \1
              master_item:
                key: ifx.storage.chunk.free_space
            - uuid: 9a42af96013942e7b9a75aa0de1c9c77
              name: 'STORAGE-004 — {#IFX_DBSPACE}/{#IFX_CHUNK} — inconsistent'
              type: DEPENDENT
              key: 'ifx.storage.chunk.inconsistent[{#IFX_DBSPACE},{#IFX_CHUNK}]'
              delay: '0'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^{#IFX_DBSPACE}\|{#IFX_CHUNK}\|[^|]+\|[01]\|[01]\|([01])\|[01]\|$'
                    - \1
              master_item:
                key: ifx.storage.chunk.state
              trigger_prototypes:
                - uuid: bc8be8d690624e41b3ebb7f268f78f14
                  expression: 'last(/Template Zabbix Tailor Informix Health/ifx.storage.chunk.inconsistent[{#IFX_DBSPACE},{#IFX_CHUNK}])=1'
                  name: 'Informix STORAGE-004: chunk {#IFX_DBSPACE}/{#IFX_CHUNK} is inconsistent'
                  priority: HIGH
            - uuid: 57524698f2484f349ac7edaa9f38c701
              name: 'STORAGE-004 — {#IFX_DBSPACE}/{#IFX_CHUNK} — offline'
              type: DEPENDENT
              key: 'ifx.storage.chunk.offline[{#IFX_DBSPACE},{#IFX_CHUNK}]'
              delay: '0'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^{#IFX_DBSPACE}\|{#IFX_CHUNK}\|[^|]+\|([01])\|[01]\|[01]\|[01]\|$'
                    - \1
              master_item:
                key: ifx.storage.chunk.state
              trigger_prototypes:
                - uuid: b47300e6d7054347bcafe066717bc3d0
                  expression: 'last(/Template Zabbix Tailor Informix Health/ifx.storage.chunk.offline[{#IFX_DBSPACE},{#IFX_CHUNK}])=1'
                  name: 'Informix STORAGE-004: chunk {#IFX_DBSPACE}/{#IFX_CHUNK} is offline'
                  priority: HIGH
            - uuid: 897db98d1fd644aaa30d3eb4953d554d
              name: 'STORAGE-004 — {#IFX_DBSPACE}/{#IFX_CHUNK} — recovering'
              type: DEPENDENT
              key: 'ifx.storage.chunk.recovering[{#IFX_DBSPACE},{#IFX_CHUNK}]'
              delay: '0'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^{#IFX_DBSPACE}\|{#IFX_CHUNK}\|[^|]+\|[01]\|([01])\|[01]\|[01]\|$'
                    - \1
              master_item:
                key: ifx.storage.chunk.state
              trigger_prototypes:
                - uuid: c7ceba7a20bd463796babf17f0c6a39e
                  expression: 'last(/Template Zabbix Tailor Informix Health/ifx.storage.chunk.recovering[{#IFX_DBSPACE},{#IFX_CHUNK}])=1'
                  name: 'Informix STORAGE-004: chunk {#IFX_DBSPACE}/{#IFX_CHUNK} is recovering'
                  priority: WARNING
            - uuid: 793d37c14ae041f9af3543b38133310e
              name: 'STORAGE-005 — {#IFX_DBSPACE}/{#IFX_CHUNK} — utilization'
              type: DEPENDENT
              key: 'ifx.storage.chunk.used_percent[{#IFX_DBSPACE},{#IFX_CHUNK}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^{#IFX_DBSPACE}\|{#IFX_CHUNK}\|[^|]+\|[^|]+\|([0-9.]+)\|$'
                    - \1
              master_item:
                key: ifx.storage.chunk.utilization
          timeout: 30s
        - uuid: 614ff61f439343a697bd79f086e69e52
          name: 'STORAGE — dbspace discovery'
          type: ZABBIX_ACTIVE
          key: ifx.storage.dbspace.discovery
          delay: 5m
          filter:
            conditions:
              - macro: '{#IFX_DBSPACE_CLASS}'
                value: ^APPLICATION$
                formulaid: A
          item_prototypes:
            - uuid: a094fb00216e4c58be804fc4cfa2b522
              name: 'STORAGE-002 — {#IFX_DBSPACE} — free space'
              type: DEPENDENT
              key: 'ifx.storage.dbspace.free_gb[{#IFX_DBSPACE}]'
              delay: '0'
              value_type: FLOAT
              units: GB
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^{#IFX_DBSPACE}\|[^|]+\|([0-9.]+)\|[^|]+\|$'
                    - \1
              master_item:
                key: ifx.storage.dbspace.free_space
            - uuid: 762e327a00034f0aab7803879aca5367
              name: 'STORAGE-003 — {#IFX_DBSPACE} — growth and expansion'
              type: DEPENDENT
              key: 'ifx.storage.dbspace.growth[{#IFX_DBSPACE}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^{#IFX_DBSPACE}\|([^|]+\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|[^|]+)\|$'
                    - \1
              master_item:
                key: ifx.storage.dbspace.growth
            - uuid: d907f7bdc6ed4f70b2410cec86abcff5
              name: 'STORAGE-001 — {#IFX_DBSPACE} — utilization'
              type: DEPENDENT
              key: 'ifx.storage.dbspace.used_percent[{#IFX_DBSPACE}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^{#IFX_DBSPACE}\|{#IFX_DBSPACE_CLASS}\|[^|]+\|[^|]+\|[^|]+\|([0-9.]+)\|$'
                    - \1
              master_item:
                key: ifx.storage.dbspace.utilization
